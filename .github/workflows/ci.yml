name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The suite is developed on macOS and shipped to whoever installs it, so
  # Linux is not a nice-to-have here — `stat -f`, `sed -i ''` and BSD flag order
  # are exactly the things that pass at home and fail on a stranger's machine.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared base tooling
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bats jq shellcheck
          else
            brew install bats-core jq shellcheck
          fi
          # Print the versions. shellcheck matters most: Ubuntu's apt ships
          # 0.9.0 and Homebrew ships 0.11.0, and 0.9 flags SC2015 on
          # `cd … && x || true` where 0.11 does not. The repo declares
          # `shellcheck >=0.9`, so 0.9 is supported and the code must be clean
          # under it — CI installing the older one is the point, not a problem.
          bats --version; jq --version; shellcheck --version | head -3

      - name: Shell toolchain suite
        run: bash skills/team-sprint/scripts/tests/run-all.sh

      # The plugin's own scripts live outside the team-sprint tree, so run-all.sh
      # never sees them. sprint_init.sh writes into a stranger's repo and is the
      # first thing they run — it does not get to be the untested one.
      - name: Plugin scripts — shellcheck and bats
        run: |
          set -euo pipefail
          # `find -exec … +`, not a glob: `scripts/*.sh` is not recursive and the
          # `find skills` step below never reaches scripts/, which left the
          # shared flow driver — the thing init, plan and execute all run on —
          # linted by nothing. find covers the next subdirectory on day one.
          find scripts -name '*.sh' -exec shellcheck {} +
          bats scripts/tests/

      # run-all.sh lints only skills/team-sprint/scripts, and the step above only
      # scripts/. That left 27 shipped scripts across nine other skills linted by
      # nothing — in a plugin whose pitch is that it stops generated artefacts
      # rotting. Everything it ships gets checked.
      - name: Every other shipped script
        run: |
          set -euo pipefail
          # `find -exec … +`, not mapfile: macOS runners are bash 3.2, where
          # mapfile does not exist. The repo's own stack profile records that
          # constraint and this step broke it on the first macOS run.
          n="$(find skills -name '*.sh' -not -path 'skills/team-sprint/scripts/*' | wc -l | tr -d ' ')"
          printf 'linting %s scripts outside the two main trees\n' "$n"
          find skills -name '*.sh' -not -path 'skills/team-sprint/scripts/*' -exec shellcheck {} +

  # P2.3 — the story is "optional tooling degrades visibly". The `tests` job above
  # installs bats, jq and shellcheck on every runner, so it proves the opposite:
  # every optional tool present, every time. This job is the actual condition —
  # ONLY the declared base set (bash, git, python3, jq), with every optional tool
  # made unreachable, asserting the scripts reach a verdict instead of dying at a
  # `require_*`.
  #
  # jq stays because it is NOT optional: crew_check.sh, coverage_check.sh,
  # detect_language.sh and preflight_subskills.sh all hard-require it. Claiming
  # otherwise in the README would be the lie this job exists to prevent.
  degradation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ONLY the declared base set
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Every entry point reaches a verdict without the optional tools
        run: bash scripts/verify_degradation.sh

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release gate the Definition of Done names: always-loaded context.
      # A commit that adds an unhidden skill without paying for it fails here.
      - name: Context budget
        run: bash scripts/budget_check.sh --verbose

      - name: Names match paths
        run: bash scripts/name_check.sh

      - name: Structural self-validation
        run: bash scripts/validate_all.sh

      - name: Manifests parse and agree on version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          entries = [p for p in market["plugins"] if p["name"] == plugin["name"]]
          if not entries:
              sys.exit(f"marketplace.json has no entry for {plugin['name']}")
          entry = entries[0]
          if entry.get("version") != plugin.get("version"):
              sys.exit(f"version mismatch: plugin.json {plugin.get('version')} "
                       f"vs marketplace entry {entry.get('version')}")
          print(f"ok {plugin['name']} {plugin['version']}")
          PY

      - name: No path coupling to one machine
        run: |
          set -euo pipefail
          # `/home/<user>` belongs here alongside `/Users/`: the Linux form slipped
          # two dead skill references past this gate, which only knew the macOS one.
          # `/home/runner` is excluded — CI's own checkout path is not coupling.
          hits="$(grep -rn -e '~/\.claude' -e '/Users/' -e '/home/[a-z]' \
                    skills/ agents/ hooks/ rules/ 2>/dev/null | grep -v '/home/runner' || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "the lines above hardcode one machine's paths"
            exit 1
          fi
          echo "ok — no hardcoded config paths"
